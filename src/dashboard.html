<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Devin Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-error": "#690005", "on-error-container": "#ffdad6", "on-secondary-container": "#b7b5b4",
                        "outline": "#8c909f", "on-primary": "#002d6e", "surface-container-lowest": "#0e0e0e",
                        "secondary": "#c8c6c5", "tertiary": "#c6c6c7", "outline-variant": "#424654",
                        "primary": "#b0c6ff", "error": "#ffb4ab", "primary-fixed-dim": "#b0c6ff",
                        "surface-bright": "#3a3939", "surface-container-highest": "#353534",
                        "tertiary-container": "#909191", "on-surface-variant": "#c2c6d6",
                        "surface-container-high": "#2a2a2a", "surface-container-low": "#1c1b1b",
                        "on-surface": "#e5e2e1", "on-background": "#e5e2e1", "on-secondary": "#313030",
                        "surface-dim": "#131313", "error-container": "#93000a", "secondary-container": "#474746",
                        "primary-container": "#558dff", "surface-variant": "#353534", "background": "#000000",
                        "surface": "#131313", "surface-container": "#201f1f"
                    },
                    borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
                    spacing: { md: "24px", sm: "16px", unit: "4px", xs: "8px", margin: "32px", lg: "40px", xl: "64px", gutter: "24px" },
                    fontFamily: { "headline-lg": ["Inter"], "label-caps": ["Inter"], "body-sm": ["Inter"], "code-md": ["JetBrains Mono"], "body-lg": ["Inter"], "headline-md": ["Inter"] },
                    fontSize: {
                        "headline-lg": ["40px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "600" }],
                        "label-caps": ["12px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "700" }],
                        "body-sm": ["14px", { lineHeight: "1.5", letterSpacing: "0.01em", fontWeight: "400" }],
                        "code-md": ["14px", { lineHeight: "1.6", letterSpacing: "0em", fontWeight: "400" }],
                        "body-lg": ["16px", { lineHeight: "1.6", letterSpacing: "0.01em", fontWeight: "400" }],
                        "headline-md": ["24px", { lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "500" }]
                    }
                },
            },
        }
    </script>
    <style>
        body { background-color: #000; color: #e5e2e1; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="font-body-sm text-body-sm selection:bg-primary-container selection:text-on-primary-container">
    <main class="py-xl px-xl max-w-7xl mx-auto space-y-xl" id="app">
        <section class="space-y-sm">
            <h1 class="font-headline-lg text-headline-lg text-on-surface">Overview</h1>
            <p class="text-on-surface-variant max-w-2xl font-body-lg text-body-lg" id="summary-text">Loading...</p>
            <div class="flex items-center gap-md pt-sm">
                <span class="font-label-caps text-[10px] text-outline uppercase tracking-wider">Timeframe</span>
                <div class="flex items-center gap-sm text-code-md font-code-md" id="range-buttons">
                    <button data-range="1d" class="text-on-surface-variant hover:text-primary transition-colors">1d</button>
                    <button data-range="1w" class="text-primary">7d</button>
                    <button data-range="1m" class="text-on-surface-variant hover:text-primary transition-colors">1m</button>
                    <button data-range="all" class="text-on-surface-variant hover:text-primary transition-colors">All</button>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-4 gap-xl py-lg" id="metrics"></section>

        <section class="pt-lg border-t border-outline-variant/20">
            <div class="flex justify-between items-center mb-sm">
                <h3 class="font-label-caps text-label-caps text-on-surface-variant">Recent Sessions</h3>
            </div>
            <div class="flex flex-col gap-xs" id="sessions"></div>
        </section>
    </main>

    <script>
        let currentRange = "1w";
        let ws;

        function connect() {
            const proto = location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === "refresh") return requestUpdate();
                render(data);
            };
            ws.onopen = () => ws.send(JSON.stringify({ type: "poll", range: currentRange }));
            ws.onclose = () => setTimeout(connect, 1000);
        }

        function requestUpdate() {
            if (ws?.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "poll", range: currentRange }));
            }
        }

        function render(data) {
            const { summary, sessions } = data;

            document.getElementById("summary-text").textContent =
                `Devin agents have processed ${summary.total_issues} tasks over the selected period` +
                (summary.success_rate !== "N/A" ? `, maintaining a ${summary.success_rate} success rate.` : ".");

            document.getElementById("metrics").innerHTML = [
                metric("Total Issues", summary.total_issues),
                metric("PRs Opened", summary.prs_opened),
                metric("Success Rate", summary.success_rate),
                metric("Active", summary.active),
            ].join("");

            document.getElementById("sessions").innerHTML = sessions.length
                ? sessions.map(sessionRow).join("")
                : `<p class="text-outline py-sm">No sessions in this timeframe.</p>`;
        }

        function metric(label, value) {
            return `<div class="flex flex-col gap-unit">
                <span class="font-label-caps text-label-caps text-on-surface-variant">${label}</span>
                <span class="font-headline-lg text-headline-lg text-on-surface">${value}</span>
            </div>`;
        }

        function sessionRow(s) {
            const statusColor = { running: "bg-primary animate-pulse", claimed: "bg-primary animate-pulse", exit: "bg-secondary", error: "bg-error", suspended: "bg-tertiary-container", new: "bg-primary animate-pulse" }[s.status] || "bg-outline";
            const statusLabel = s.status === "exit" ? "completed" : s.status;
            const statusTextColor = s.status === "error" ? "text-error" : s.status === "running" || s.status === "claimed" ? "text-primary" : "text-on-surface-variant";

            let prHtml = "";
            if (s.pr) {
                const icon = s.pr_outcome === "merged" ? "check_circle" : s.pr_outcome === "closed" ? "close" : "call_merge";
                const color = s.pr_outcome === "merged" ? "text-primary" : "";
                const prNum = s.pr.split("/").pop();
                prHtml = `<div class="flex items-center gap-xs ${color}">
                    <span class="material-symbols-outlined text-[16px]">${icon}</span>
                    <a href="${s.pr}" target="_blank" class="hover:underline">PR #${prNum}: ${(s.pr_outcome || "open").toUpperCase()}</a>
                </div>`;
            }

            return `<div class="flex flex-col md:flex-row md:items-center justify-between py-sm">
                <div class="flex items-center gap-md">
                    <span class="flex h-2 w-2 rounded-full ${statusColor}"></span>
                    <div class="flex flex-col">
                        <span class="text-on-surface font-medium">${s.title}</span>
                        <span class="text-[11px] font-code-md ${statusTextColor} uppercase tracking-widest">${statusLabel}</span>
                    </div>
                </div>
                <div class="flex items-center gap-lg mt-xs md:mt-0 font-code-md text-body-sm text-on-surface-variant">
                    ${prHtml}
                    <span class="text-outline">${s.duration}</span>
                    <a href="${s.devin_url}" target="_blank" title="Open Devin session" class="text-primary hover:text-on-surface transition-colors"><span class="material-symbols-outlined text-[16px]">open_in_new</span></a>
                </div>
            </div>`;
        }

        document.getElementById("range-buttons").addEventListener("click", (e) => {
            if (!e.target.dataset.range) return;
            currentRange = e.target.dataset.range;
            document.querySelectorAll("#range-buttons button").forEach(b => b.className = "text-on-surface-variant hover:text-primary transition-colors");
            e.target.className = "text-primary";
            requestUpdate();
        });

        connect();
    </script>
</body>
</html>
